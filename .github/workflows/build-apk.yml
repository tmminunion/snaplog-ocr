name: Build Scan2API Android APK & AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      play_track:
        description: 'Google Play Track (pilih none untuk skip upload Play Store)'
        required: true
        type: choice
        default: 'internal'
        options:
          - internal
          - alpha
          - beta
          - production
          - none
      play_status:
        description: 'Status rilis Play Store'
        required: true
        type: choice
        default: 'completed'
        options:
          - completed
          - draft
      release_notes:
        description: 'Catatan rilis (opsional)'
        required: false
        type: string
        default: 'Pembaruan Scan2API: branding baru Scan2API, Multi-API (CRUD & 1 aktif), payload dinamis POST/GET + ID generator, auto-capture QR/Barcode, dan live OCR.'

concurrency:
  group: build-scan2api-apk-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    name: Analyze, Test & Build Scan2API Release APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Read Version Metadata
        id: meta
        run: |
          VER_RAW=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          BASE_NAME=${VER_RAW%%+*}
          BASE_CODE=${VER_RAW##*+}
          IFS='.' read -r VER_MAJOR VER_MINOR VER_PATCH <<< "$BASE_NAME"
          VER_MAJOR=${VER_MAJOR:-1}
          VER_MINOR=${VER_MINOR:-0}
          VER_PATCH=${VER_PATCH:-0}
          TOTAL_STEPS=$(( 10#$VER_MAJOR * 1000 + 10#$VER_MINOR * 100 + 10#$VER_PATCH + GITHUB_RUN_NUMBER ))
          CALC_MAJOR=$(( TOTAL_STEPS / 1000 ))
          REM_MAJOR=$(( TOTAL_STEPS % 1000 ))
          CALC_MINOR=$(( REM_MAJOR / 100 ))
          CALC_PATCH=$(( REM_MAJOR % 100 ))
          VER_NAME="${CALC_MAJOR}.${CALC_MINOR}.${CALC_PATCH}"
          VER_CODE=$(( 10#$BASE_CODE + GITHUB_RUN_NUMBER ))
          echo "Resolved build version: v${VER_NAME} (code ${VER_CODE})"
          echo "version_name=${VER_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VER_CODE}" >> "$GITHUB_OUTPUT"

      - name: Bootstrap Android Project
        run: |
          rm -rf android /tmp/snaplog_tpl
          flutter create /tmp/snaplog_tpl --project-name snaplog_ocr --org id.nufat --platforms=android
          cp -r /tmp/snaplog_tpl/android ./android
          rm -rf /tmp/snaplog_tpl

          cat <<'EOF' > android/app/proguard-rules.pro
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.internal.mlkit_** { *; }
          -keep class com.google.android.gms.vision.** { *; }
          -keep class com.google_mlkit_text_recognition.** { *; }
          -keep class com.google_mlkit_barcode_scanning.** { *; }
          -keep class com.google_mlkit_commons.** { *; }
          EOF

          python3 - <<'PYEOF'
          import os
          import re

          mpath = "android/app/src/main/AndroidManifest.xml"
          m = open(mpath, "r", encoding="utf-8").read()
          perms = (
              '<uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.CAMERA"/>\n'
              '    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n'
          )
          if "android.permission.CAMERA" not in m:
              m = m.replace("<application", perms + "    <application", 1)
          m = re.sub(r'android:label="[^"]*"', 'android:label="Scan2API"', m)
          if "android:allowBackup" not in m:
              m = m.replace("<application", '<application\n        android:allowBackup="false"', 1)
          open(mpath, "w", encoding="utf-8").write(m)

          # Ensure minSdk >= 21 and disable R8 stripping that breaks ML Kit ComponentRegistrar reflection
          kts_path = "android/app/build.gradle.kts"
          if os.path.exists(kts_path):
              txt = open(kts_path, "r", encoding="utf-8").read()
              txt = txt.replace(
                  "minSdk = flutter.minSdkVersion",
                  "minSdk = maxOf(21, flutter.minSdkVersion)",
              )
              if "isMinifyEnabled" not in txt:
                  txt = txt.replace(
                      'signingConfig = signingConfigs.getByName("debug")',
                      'signingConfig = signingConfigs.getByName("debug")\n'
                      '            isMinifyEnabled = false\n'
                      '            isShrinkResources = false\n'
                      '            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")',
                      1,
                  )
              open(kts_path, "w", encoding="utf-8").write(txt)
          PYEOF

      - name: Install Dependencies & Generate App Icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Unit Tests
        run: flutter test

      - name: Configure Release Signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 not set; skipping release signing."
            exit 0
          fi

          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          python3 - <<'PYEOF'
          import os

          kts_path = "android/app/build.gradle.kts"
          groovy_path = "android/app/build.gradle"

          if os.path.exists(kts_path):
              txt = open(kts_path, "r", encoding="utf-8").read()
              header = (
                  "import java.util.Properties\n"
                  "import java.io.FileInputStream\n\n"
                  "val keystoreProperties = Properties()\n"
                  "val keystorePropertiesFile = rootProject.file(\"key.properties\")\n"
                  "if (keystorePropertiesFile.exists()) {\n"
                  "    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n"
                  "}\n\n"
              )
              if "keystorePropertiesFile" not in txt:
                  txt = header + txt
              signing_block = (
                  "    signingConfigs {\n"
                  "        create(\"release\") {\n"
                  "            keyAlias = keystoreProperties.getProperty(\"keyAlias\")\n"
                  "            keyPassword = keystoreProperties.getProperty(\"keyPassword\")\n"
                  "            storeFile = keystoreProperties.getProperty(\"storeFile\")?.let { file(it) }\n"
                  "            storePassword = keystoreProperties.getProperty(\"storePassword\")\n"
                  "        }\n"
                  "    }\n\n"
                  "    buildTypes {"
              )
              if "create(\"release\")" not in txt:
                  txt = txt.replace("    buildTypes {", signing_block, 1)
              txt = txt.replace(
                  "signingConfig = signingConfigs.getByName(\"debug\")",
                  "signingConfig = signingConfigs.getByName(\"release\")"
              )
              open(kts_path, "w", encoding="utf-8").write(txt)
              print("Configured release signing in build.gradle.kts")
          elif os.path.exists(groovy_path):
              txt = open(groovy_path, "r", encoding="utf-8").read()
              header = (
                  "def keystoreProperties = new Properties()\n"
                  "def keystorePropertiesFile = rootProject.file('key.properties')\n"
                  "if (keystorePropertiesFile.exists()) {\n"
                  "    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n"
                  "}\n\n"
              )
              if "keystorePropertiesFile" not in txt:
                  txt = header + txt
              signing_block = (
                  "    signingConfigs {\n"
                  "        release {\n"
                  "            keyAlias keystoreProperties['keyAlias']\n"
                  "            keyPassword keystoreProperties['keyPassword']\n"
                  "            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null\n"
                  "            storePassword keystoreProperties['storePassword']\n"
                  "        }\n"
                  "    }\n\n"
                  "    buildTypes {"
              )
              if "signingConfigs {" not in txt:
                  txt = txt.replace("    buildTypes {", signing_block, 1)
              txt = txt.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
              open(groovy_path, "w", encoding="utf-8").write(txt)
              print("Configured release signing in build.gradle")
          PYEOF

      - name: Build Signed Release APK & AAB (Play Store)
        env:
          GRADLE_OPTS: -Dorg.gradle.internal.http.retry.maxRetries=5 -Dorg.gradle.internal.http.retry.initialBackoff=3000
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release \
              --build-name="${{ steps.meta.outputs.version_name }}" \
              --build-number="${{ steps.meta.outputs.version_code }}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Retrying APK build after transient network/Maven error (attempt $attempt)..."
            sleep 10
          done
          cp build/app/outputs/flutter-apk/app-release.apk \
            "Scan2API-v${{ steps.meta.outputs.version_name }}-code${{ steps.meta.outputs.version_code }}-release.apk"

          for attempt in 1 2 3; do
            if flutter build appbundle --release \
              --build-name="${{ steps.meta.outputs.version_name }}" \
              --build-number="${{ steps.meta.outputs.version_code }}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Retrying AAB build after transient network/Maven error (attempt $attempt)..."
            sleep 10
          done
          cp build/app/outputs/bundle/release/app-release.aab \
            "Scan2API-v${{ steps.meta.outputs.version_name }}-code${{ steps.meta.outputs.version_code }}-release.aab"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version_name }}+${{ steps.meta.outputs.version_code }}
          name: Scan2API v${{ steps.meta.outputs.version_name }} (Build ${{ steps.meta.outputs.version_code }})
          body: |
            Build otomatis Signed Android Release APK & Play Store AAB untuk **Scan2API — OCR, QR & Barcode to REST API** (`id.nufat.snaplog_ocr`, `v${{ steps.meta.outputs.version_name }}+${{ steps.meta.outputs.version_code }}`).
          files: |
            Scan2API-v${{ steps.meta.outputs.version_name }}-code${{ steps.meta.outputs.version_code }}-release.apk
            Scan2API-v${{ steps.meta.outputs.version_name }}-code${{ steps.meta.outputs.version_code }}-release.aab
          make_latest: true

      - name: Validate Play Store Credentials & Notes
        if: github.event_name == 'workflow_dispatch' && inputs.play_track != 'none'
        id: play_prep
        env:
          SA_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          RAW_NOTES: ${{ inputs.release_notes }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::Secret PLAY_STORE_SERVICE_ACCOUNT_JSON belum diisi di repository tmminunion/snaplog-ocr!"
            exit 1
          fi

          if [ -n "$RAW_NOTES" ]; then
            mkdir -p /tmp/play-whatsnew
            printf '%s\n' "$RAW_NOTES" > /tmp/play-whatsnew/whatsnew-id
            echo "has_notes=true" >> $GITHUB_OUTPUT
          else
            echo "has_notes=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish AAB to Google Play Store (with Release Notes)
        if: github.event_name == 'workflow_dispatch' && inputs.play_track != 'none' && steps.play_prep.outputs.has_notes == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: id.nufat.snaplog_ocr
          releaseFiles: Scan2API-v${{ steps.meta.outputs.version_name }}-code${{ steps.meta.outputs.version_code }}-release.aab
          tracks: ${{ inputs.play_track }}
          status: ${{ inputs.play_status }}
          whatsNewDirectory: /tmp/play-whatsnew

      - name: Publish AAB to Google Play Store
        if: github.event_name == 'workflow_dispatch' && inputs.play_track != 'none' && steps.play_prep.outputs.has_notes != 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: id.nufat.snaplog_ocr
          releaseFiles: Scan2API-v${{ steps.meta.outputs.version_name }}-code${{ steps.meta.outputs.version_code }}-release.aab
          tracks: ${{ inputs.play_track }}
          status: ${{ inputs.play_status }}

      - name: Sync Global Store Listing Description to Google Play
        if: github.event_name == 'workflow_dispatch' && inputs.play_track != 'none'
        env:
          SA_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 -m pip install --quiet google-auth requests
          python3 - <<'PYEOF'
          import json
          import os
          import requests
          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          sa_raw = os.environ.get("SA_JSON", "").strip()
          if not sa_raw:
              print("No SA_JSON; skipping listing sync.")
              raise SystemExit(0)

          creds = service_account.Credentials.from_service_account_info(
              json.loads(sa_raw),
              scopes=["https://www.googleapis.com/auth/androidpublisher"],
          )
          creds.refresh(Request())
          headers = {
              "Authorization": f"Bearer {creds.token}",
              "Content-Type": "application/json",
          }
          base = "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/id.nufat.snaplog_ocr/edits"

          try:
              r_edit = requests.post(base, headers=headers, json={}, timeout=30)
              r_edit.raise_for_status()
              edit_id = r_edit.json()["id"]

              r_list = requests.get(f"{base}/{edit_id}/listings", headers=headers, timeout=30)
              r_list.raise_for_status()
              listings = r_list.json().get("listings", [])
              langs = [item.get("language") for item in listings if item.get("language")] or ["id"]

              store_title = "Scan2API: OCR, QR & Barcode"
              id_short = "Scanner OCR, QR & Barcode offline dengan kirim REST API POST/GET dinamis & CSV."
              id_full = (
                  "Scan2API adalah aplikasi scanner offline-first untuk memindai teks kamera (OCR), QR Code, dan Barcode "
                  "secara otomatis lalu mengirimkannya langsung ke REST API / Webhook Anda atau mengekspornya ke CSV.\n\n"
                  "Fitur Utama:\n"
                  "• Live OCR dengan ROI Focus Box: Tangkap nomor seri, meteran, kode produksi, dan label secara real-time "
                  "dengan auto-save saat hasil stabil 3 frame.\n"
                  "• Auto-Capture QR & Barcode: Pindai QR Code dan berbagai format Barcode secara instan tanpa klik.\n"
                  "• Multi-API & Payload Dinamis (POST/GET): Simpan banyak endpoint API, pilih 1 API aktif, atur Custom Header, "
                  "dan tambahkan custom field beserta ID generator string acak.\n"
                  "• Riwayat Lokal & Ekspor CSV: Semua hasil pindaian tersimpan offline dan siap diekspor ke CSV/Excel."
              )

              en_short = "Offline OCR, QR & Barcode scanner with dynamic REST API (POST/GET) & CSV export."
              en_full = (
                  "Scan2API is an offline-first camera scanner built to capture text (OCR), QR Codes, and Barcodes "
                  "automatically and send them straight to your REST API / Webhook or export to CSV.\n\n"
                  "Key Features:\n"
                  "• Live Offline OCR with ROI Focus Box: Capture serial numbers, meters, and labels in real time "
                  "with 3-frame stability auto-save.\n"
                  "• Instant QR & Barcode Auto-Capture: Hands-free offline scanning for QR Codes and 1D/2D barcodes.\n"
                  "• Multi-API & Dynamic Payload (POST/GET): Manage multiple REST API profiles with a single active endpoint, "
                  "custom headers, dynamic key-value fields, and random ID string generator.\n"
                  "• Local History & One-Tap CSV Export: Keep structured offline logs and export directly to CSV/Excel."
              )

              for lang in langs:
                  is_en = lang.lower().startswith("en")
                  body = {
                      "language": lang,
                      "title": store_title,
                      "shortDescription": en_short if is_en else id_short,
                      "fullDescription": en_full if is_en else id_full,
                  }
                  ru = requests.put(f"{base}/{edit_id}/listings/{lang}", headers=headers, json=body, timeout=30)
                  ru.raise_for_status()
                  print(f"Updated Google Play Store listing for language: {lang}")

              rc = requests.post(f"{base}/{edit_id}:commit", headers=headers, timeout=30)
              if rc.status_code == 400 and "changesNotSentForReview" in rc.text:
                  rc = requests.post(
                      f"{base}/{edit_id}:commit?changesNotSentForReview=true",
                      headers=headers,
                      timeout=30,
                  )
              rc.raise_for_status()
              print("Successfully committed global Store Listing description to Google Play!")
          except Exception as exc:
              print(f"::warning::Store listing sync warning (AAB upload unaffected): {exc}")
          PYEOF

      - name: Send APK & AAB Link to Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_FILE: "Scan2API-v${{ steps.meta.outputs.version_name }}-code${{ steps.meta.outputs.version_code }}-release.apk"
          AAB_FILE: "Scan2API-v${{ steps.meta.outputs.version_name }}-code${{ steps.meta.outputs.version_code }}-release.aab"
          RELEASE_URL: "https://github.com/${{ github.repository }}/releases/tag/v${{ steps.meta.outputs.version_name }}+${{ steps.meta.outputs.version_code }}"
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Secret Telegram belum diset; melewati notifikasi."
            exit 0
          fi

          if [ -f "$APK_FILE" ] && [ -f "$AAB_FILE" ]; then
            APK_MB=$(awk "BEGIN {printf \"%.2f\", $(wc -c < "$APK_FILE")/1048576}")
            AAB_MB=$(awk "BEGIN {printf \"%.2f\", $(wc -c < "$AAB_FILE")/1048576}")
            MSG=$(printf "🚀 Scan2API v${{ steps.meta.outputs.version_name }} (Build ${{ steps.meta.outputs.version_code }}) berhasil dibuild!\n📱 APK: %s (%s MB)\n🏪 AAB (Play Store): %s (%s MB)\n📥 Release: %s" "${APK_FILE}" "${APK_MB}" "${AAB_FILE}" "${AAB_MB}" "${RELEASE_URL}")
          else
            MSG="❌ Build Scan2API v${{ steps.meta.outputs.version_name }} (Build ${{ steps.meta.outputs.version_code }}) gagal menghasilkan file APK/AAB."
          fi

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null

      - name: Cleanup Temporary Files & Workflow Artifacts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf build android /tmp/snaplog_tpl *.apk *.aab
          ARTIFACT_IDS=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[].id' 2>/dev/null || true)
          for AID in $ARTIFACT_IDS; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${AID}" >/dev/null 2>&1 || true
          done
